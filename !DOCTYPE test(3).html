<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百年美学风格定位系统</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0d10; --card: #17161a; --card-hover: #1e1c22; --line: #2a2830;
    --gold: #c9a86a; --gold-soft: #e0c894; --text: #e8e4dc; --muted: #8f8a80;
    --c-A: #c9a86a; --c-B: #9c4a4a; --c-C: #a8805a; --c-D: #d4b87a; --c-E: #7e8fa0; --c-F: #6f8060;
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; min-height: 100vh; display: flex; justify-content: center; padding: 44px 20px 100px; line-height: 1.75; -webkit-font-smoothing: antialiased; }
  .app { width: 100%; max-width: 700px; }
  .serif { font-family: "Songti SC", "Noto Serif SC", Georgia, "Times New Roman", serif; }
  .screen { display: none; } .screen.active { display: block; animation: fadeUp .5s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .cover { text-align: center; padding: 40px 0 24px; }
  .cover .kicker { font-size: 11px; letter-spacing: .42em; color: var(--gold); margin-bottom: 24px; text-transform: uppercase; }
  .cover h1 { font-size: clamp(30px, 6vw, 46px); font-weight: 600; letter-spacing: .04em; line-height: 1.35; margin-bottom: 20px; }
  .cover h1 em { font-style: normal; color: var(--gold-soft); }
  .cover .lead { color: var(--muted); font-size: 15px; max-width: 520px; margin: 0 auto 12px; }
  .cover .lead.small { font-size: 13px; color: #6d685f; margin-bottom: 38px; }
  .cover .formula { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: 11px 26px; font-size: 13px; color: var(--gold-soft); letter-spacing: .08em; margin-bottom: 42px; background: rgba(201,168,106,.05); }
  .btn { font: inherit; cursor: pointer; border: none; border-radius: 999px; padding: 16px 48px; background: linear-gradient(135deg, #c9a86a, #e0c894); color: #16140f; font-weight: 600; letter-spacing: .1em; font-size: 15px; transition: .25s; box-shadow: 0 12px 32px -14px rgba(201,168,106,.6); }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 18px 40px -14px rgba(201,168,106,.75); }
  .btn:active { transform: translateY(0); }
  .btn.ghost { background: transparent; color: var(--gold); border: 1px solid var(--line); box-shadow: none; padding: 13px 34px; font-weight: 500; font-size: 14px; }
  .btn.ghost:hover { border-color: var(--gold); background: rgba(201,168,106,.07); }
  .btn.small { padding: 10px 22px; font-size: 13px; }
  .q-head { margin-bottom: 30px; }
  .progress-wrap { margin-bottom: 30px; }
  .progress-top { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .22em; color: var(--muted); margin-bottom: 10px; }
  .progress-bar { height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .progress-bar i { display: block; height: 100%; background: linear-gradient(90deg, #c9a86a, #e0c894); width: 0; transition: width .5s cubic-bezier(.4,0,.2,1); }
  .q-title { font-size: clamp(20px, 4vw, 27px); font-weight: 600; letter-spacing: .03em; line-height: 1.55; margin-bottom: 8px; }
  .q-sub { color: var(--muted); font-size: 13.5px; }
  .options { display: flex; flex-direction: column; gap: 11px; margin-top: 28px; }
  .option { display: flex; gap: 15px; align-items: flex-start; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); color: inherit; padding: 16px 20px; border-radius: 14px; cursor: pointer; font: inherit; transition: .22s; }
  .option:hover { border-color: var(--gold); background: var(--card-hover); transform: translateY(-2px); }
  .option.selected { border-color: var(--gold); background: rgba(201,168,106,.09); }
  .option .badge { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--gold); background: rgba(201,168,106,.06); transition: .22s; }
  .option:hover .badge, .option.selected .badge { background: rgba(201,168,106,.2); border-color: var(--gold); }
  .option .opt-text { font-size: 14.5px; letter-spacing: .02em; }
  .q-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 32px; gap: 12px; }
  .result-head { text-align: center; padding: 8px 0 36px; }
  .eyebrow { font-size: 11px; letter-spacing: .34em; color: var(--gold); margin-bottom: 18px; }
  .result-head h1 { font-size: clamp(26px, 5.5vw, 40px); font-weight: 600; letter-spacing: .04em; line-height: 1.35; margin-bottom: 14px; }
  .result-head .en { font-size: 13px; color: var(--muted); letter-spacing: .2em; margin-bottom: 18px; }
  .slogan { font-size: 17px; color: var(--gold-soft); letter-spacing: .05em; line-height: 1.75; }
  .section-label { font-size: 11px; letter-spacing: .3em; color: var(--gold); margin-bottom: 16px; }
  .chart { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px 22px; margin-bottom: 30px; }
  .chart-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .chart-row:last-child { margin-bottom: 0; }
  .chart-label { flex: 0 0 92px; font-size: 13px; color: #cfc9be; letter-spacing: .03em; }
  .chart-bar-bg { flex: 1; height: 8px; background: #232128; border-radius: 999px; overflow: hidden; }
  .chart-bar-fill { height: 100%; border-radius: 999px; width: 0; transition: width 1s cubic-bezier(.4,0,.2,1); }
  .chart-row.dominant .chart-label { color: var(--text); font-weight: 600; }
  .thought { background: var(--card); border-left: 3px solid var(--gold); border-radius: 0 14px 14px 0; padding: 20px 24px; font-size: 14.5px; color: #cfc9be; margin-bottom: 30px; line-height: 1.85; }
  .thought b { color: var(--gold-soft); font-weight: 600; }
  .ratio-card { display: flex; gap: 12px; margin-bottom: 30px; }
  .ratio-item { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 16px; text-align: center; }
  .ratio-item .r-name { font-size: 15px; color: #e8e4dc; margin-top: 2px; letter-spacing: .05em; font-weight: 600; }
  .ratio-item .r-sub { font-size: 11px; color: var(--muted); margin-top: 6px; letter-spacing: .15em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .cell { background: var(--card); border: 1px solid var(--line); border-radius: 13px; padding: 16px 18px; }
  .cell .k { font-size: 10.5px; letter-spacing: .22em; color: var(--gold); margin-bottom: 8px; }
  .cell .v { font-size: 13.5px; color: #ddd8ce; line-height: 1.75; }
  .cell.wide { grid-column: 1 / -1; }
  .cell ul { list-style: none; display: flex; flex-wrap: wrap; gap: 7px; }
  .cell ul li { font-size: 12.5px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 13px; color: #ddd8ce; }
  .tags { display: flex; flex-wrap: wrap; gap: 9px; justify-content: center; margin-bottom: 34px; }
  .tags span { font-size: 12.5px; color: var(--gold-soft); border: 1px solid rgba(201,168,106,.35); background: rgba(201,168,106,.07); border-radius: 999px; padding: 5px 15px; letter-spacing: .05em; }
  .advice { background: rgba(201,168,106,.05); border: 1px solid rgba(201,168,106,.2); border-radius: 16px; padding: 24px; margin-bottom: 30px; }
  .advice .a-title { font-size: 12px; letter-spacing: .24em; color: var(--gold); margin-bottom: 14px; }
  .advice p { font-size: 14px; color: #cfc9be; line-height: 1.85; margin-bottom: 10px; }
  .advice p:last-child { margin-bottom: 0; }
  .advice b { color: var(--gold-soft); font-weight: 600; }
  .alt { border-top: 1px solid var(--line); padding-top: 26px; margin-bottom: 34px; }
  .alt .alt-title { font-size: 11px; letter-spacing: .24em; color: var(--muted); margin-bottom: 16px; text-align: center; }
  .alt .alt-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .alt .alt-item { font-size: 13px; color: #cbc5ba; border: 1px dashed var(--line); border-radius: 10px; padding: 9px 17px; }
  .result-foot { text-align: center; }

  .style-visual {
    width: 100%;
    height: 200px;
    border-radius: 18px;
    margin-bottom: 30px;
    display: grid;
    place-items: center;
    font-size: 56px;
    color: rgba(255,255,255,.92);
    text-shadow: 0 2px 20px rgba(0,0,0,.5);
    background-size: cover;
    background-position: center;
    position: relative;
    overflow: hidden;
    border: 1px solid var(--line);
    transition: background .6s ease;
  }
  .style-visual .visual-label {
    position: absolute;
    bottom: 14px;
    left: 18px;
    font-size: 13px;
    letter-spacing: .15em;
    color: rgba(255,255,255,.85);
    text-shadow: 0 1px 12px rgba(0,0,0,.7);
  }

  @media (max-width: 480px) { body { padding: 28px 16px 76px; } .option { padding: 14px 16px; gap: 13px; } .cell { padding: 14px 16px; } .chart-label { flex: 0 0 76px; font-size: 12px; } .style-visual { height: 160px; font-size: 44px; } }
</style>
</head>
<body>
<div class="app">
  <section class="screen active" id="screen-start">
    <div class="cover">
      <p class="kicker">Century Aesthetic System</p>
      <h1 class="serif">百年美学<br><em>风格定位</em></h1>
      <p class="lead">30 道题，60 种风格。从 1920s 到 2020s，找到你思想深处对应的那一种。</p>
      <p class="lead small">约 6 分钟 · 凭第一直觉作答</p>
      <div class="formula">思想 → 情感 → 风格 → 单品</div><br>
      <button class="btn" id="btn-start">开始定位</button>
    </div>
  </section>

  <section class="screen" id="screen-quiz">
    <div class="progress-wrap">
      <div class="progress-top"><span id="phase-label">存在基调</span><span id="progress-count">01 / 30</span></div>
      <div class="progress-bar"><i id="progress-fill"></i></div>
    </div>
    <div class="q-head"><h2 class="q-title serif" id="q-title"></h2><p class="q-sub" id="q-sub"></p></div>
    <div class="options" id="q-options"></div>
    <div class="q-nav">
      <button class="btn ghost small" id="btn-prev" style="visibility:hidden;">上一题</button>
      <button class="btn ghost small" id="btn-next" style="visibility:hidden;">下一题</button>
    </div>
  </section>

  <section class="screen" id="screen-result">
    <div class="result-head">
      <p class="eyebrow" id="r-eyebrow"></p>
      <h1 class="serif" id="r-name"></h1>
      <p class="en" id="r-en"></p>
      <p class="slogan serif" id="r-slogan"></p>
    </div>

    <div class="style-visual" id="r-visual"></div>

    <p class="section-label">思想原型分布</p>
    <div class="chart" id="r-chart"></div>
    <div class="thought" id="r-thought"></div>
    <p class="section-label">风格配比</p>
    <div class="ratio-card" id="r-ratio"></div>
    <p class="section-label">穿搭系统</p>
    <div class="grid" id="r-grid"></div>
    <div class="tags" id="r-tags"></div>
    <div class="advice" id="r-advice"></div>
    <div class="alt" id="r-alt"><p class="alt-title">同思想谱系下的其他可能</p><div class="alt-list" id="r-alt-list"></div></div>
    <div class="result-foot"><button class="btn ghost" id="btn-restart">重新定位</button></div>
  </section>
</div>

<script>
/* ============================================================
   风格库（60种，按原型归类）
   ============================================================ */
const STYLES = {
  /* ========== A 秩序理性 ========== */
  bauhaus: { name:'包豪斯/风格派', archetype:'A', desc:'艺术进入生活与工业，美来自功能、秩序和普世理性。', slogan:'“形式追随功能。”', colors:'红黄蓝 + 黑灰白', materials:'钢、玻璃、皮革、几何织物', items:['几何色块衬衫','直线剪裁外套','原色针织'], accessories:'几何胸针、极简腕表', avoid:'繁复装饰、曲线、柔和色', gradient:'linear-gradient(135deg, #d32f2f, #fbc02d, #1976d2)', emoji:'◼️' },
  international: { name:'国际风格/流线型', archetype:'A', desc:'相信效率、速度与未来；少装饰，多流畅与进步感。', slogan:'“少即是多，流动即未来。”', colors:'银灰、白、黑、金属色', materials:'钢、玻璃、光滑面料', items:['流线型大衣','几何剪裁西装','金属配饰'], accessories:'银饰、极简包', avoid:'复古花纹、蕾丝、厚重装饰', gradient:'linear-gradient(135deg, #b0bec5, #eceff1, #90a4ae)', emoji:'〰️' },
  midcentury: { name:'中世纪现代', archetype:'A', desc:'战后乐观主义；设计应民主、舒适、有机而现代。', slogan:'“好设计属于每个人。”', colors:'芥末黄、橄榄绿、橙、棕', materials:'木材、羊毛、棉、皮革', items:['A字裙','针织开衫','直筒裤'], accessories:'复古胸针、皮带、乐福鞋', avoid:'过度奢华、荧光色', gradient:'linear-gradient(135deg, #c9a227, #6b7a3a, #b5651d)', emoji:'🪑' },
  minimalism: { name:'极简主义', archetype:'A', desc:'减少到本质；反装饰、反喧哗，让剪裁、材质和空间说话。', slogan:'“少即是多，沉默是力量。”', colors:'黑、白、灰、米', materials:'棉、羊毛、皮革、哑光', items:['白衬衫','黑色直筒裤','极简大衣'], accessories:'一块表、素戒', avoid:'印花、亮片、层叠', gradient:'linear-gradient(135deg, #1a1a1a, #4a4a4a, #e8e4dc)', emoji:'◻️' },
  minimal_revival: { name:'极简回潮', archetype:'A', desc:'反消费喧嚣；克制、平静、品质、去Logo。', slogan:'“我拥有的越少，我越自由。”', colors:'米白、灰、驼、黑', materials:'羊绒、有机棉、亚麻', items:['无Logo针织','阔腿裤','平底鞋'], accessories:'帆布包、细项链', avoid:'大Logo、快时尚、繁复', gradient:'linear-gradient(135deg, #f5f1e8, #d7d2c6, #b8b2a5)', emoji:'🕊️' },
  hitech: { name:'高技派', archetype:'A', desc:'科技崇拜与结构诚实；进步感就是美。', slogan:'“结构外露，就是未来。”', colors:'银、灰、黑、亮橙', materials:'金属、尼龙、透明材质', items:['机能外套','外露拉链裤','战术靴'], accessories:'护目镜、金属包', avoid:'田园、复古、蕾丝', gradient:'linear-gradient(135deg, #607d8b, #cfd8dc, #ff6f00)', emoji:'⚙️' },
  industrial: { name:'工业风', archetype:'A', desc:'原始、城市、反精致；仓库、金属、裸露结构即诚实。', slogan:'“粗糙，是另一种真实。”', colors:'黑、灰、铁锈红、棕', materials:'皮革、牛仔、金属、帆布', items:['工装夹克','直筒牛仔裤','马丁靴'], accessories:'金属链、皮带、帆布包', avoid:'精致、柔美、亮色', gradient:'linear-gradient(135deg, #1c1c1c, #4a4a4a, #8d4a2f)', emoji:'🔩' },
  quiet_luxury: { name:'静奢风', archetype:'A', desc:'低调财富、品质、反Logo；我不需要向你证明。', slogan:'“我不需要证明，但我掌控局面。”', colors:'黑、白、驼、灰、海军蓝', materials:'羊绒、真丝、精纺羊毛', items:['无Logo西装','高领针织','直筒西裤'], accessories:'小珍珠、金属表', avoid:'大Logo、荧光色、破洞', gradient:'linear-gradient(135deg, #2a2a2a, #a89684, #e8e4dc)', emoji:'💎' },
  old_money: { name:'老钱风', archetype:'A', desc:'传统、血统、阶级与永恒；低调是权力的从容。', slogan:'“真正的优雅从不喧哗。”', colors:'驼、米、海军蓝、酒红', materials:'羊绒、粗花呢、真丝', items:['马术外套','百褶裙','乐福鞋'], accessories:'珍珠、丝巾、复古腕表', avoid:'街头、荧光、过度暴露', gradient:'linear-gradient(135deg, #c4a77d, #f0e6d2, #1a2a4a)', emoji:'🐎' },
  power_suit: { name:'女性主义/权力套装', archetype:'A', desc:'女性进入公共权力场；用西装、垫肩、领带争取平等与可见性。', slogan:'“我穿西装，不是为了像男人。”', colors:'黑、灰、海军蓝、白', materials:'精纺羊毛、真丝、皮革', items:['垫肩西装','阔腿裤','领带'], accessories:'公文包、腕表', avoid:'柔弱、蕾丝、粉嫩', gradient:'linear-gradient(135deg, #1a1a1a, #2c3e50, #4a5568)', emoji:'👔' },
  brutalism: { name:'粗野主义', archetype:'A', desc:'诚实暴露材料与结构；反精致、反资产阶级伪装。', slogan:'“混凝土也是诗。”', colors:'灰、黑、白、锈色', materials:'混凝土感面料、粗织、金属', items:['厚重外套','直筒裤','工装靴'], accessories:'金属、皮革', avoid:'精致、轻盈、装饰', gradient:'linear-gradient(135deg, #6d6d6d, #3a3a3a, #8d5a3a)', emoji:'🧱' },

  /* ========== B 反叛边缘 ========== */
  constructivism: { name:'构成主义', archetype:'B', desc:'服装也可以是结构、革命与集体的宣言，反装饰、反个人奢侈。', slogan:'“结构即革命。”', colors:'红、黑、白', materials:'帆布、金属、工业面料', items:['束带外套','几何剪裁裤','工装'], accessories:'金属扣、皮带', avoid:'奢华、柔美、装饰', gradient:'linear-gradient(135deg, #d32f2f, #1a1a1a, #e8e4dc)', emoji:'🔻' },
  expressionism: { name:'表现主义', archetype:'B', desc:'外在造型应泄露内在情绪，扭曲、浓烈、不安都是真实。', slogan:'“情绪就是形状。”', colors:'浓烈撞色、暗红、深蓝', materials:'粗织、皮革、混纺', items:['不对称外套','扭曲剪裁裙','戏剧感衬衫'], accessories:'夸张耳饰、厚底鞋', avoid:'克制、极简、柔和', gradient:'linear-gradient(135deg, #8b1a1a, #2a2a5a, #1a1a1a)', emoji:'🌀' },
  punk: { name:'朋克', archetype:'B', desc:'DIY、反体制、反时尚；用破洞与别针表达愤怒和自主。', slogan:'“我不服从，我存在。”', colors:'黑、红、白、荧光', materials:'皮革、牛仔、金属、格纹', items:['皮衣','破洞T','马丁靴'], accessories:'铆钉、安全别针、链条', avoid:'精致、温柔、保守', gradient:'linear-gradient(135deg, #1a1a1a, #9c4a4a, #1a1a1a)', emoji:'🧷' },

/* ============================================================
   状态与工具
   ============================================================ */
const state = { current: 0, answers: new Array(QUESTIONS.length).fill(null) };
function $(id) { return document.getElementById(id); }
function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); $(id).classList.add('active'); window.scrollTo({ top: 0, behavior: 'smooth' }); }

/* ============================================================
   答题渲染
   ============================================================ */
function renderQuestion() {
  const q = QUESTIONS[state.current];
  const total = QUESTIONS.length;
  $('phase-label').textContent = PHASES[q.phase];
  $('progress-count').textContent = String(state.current + 1).padStart(2, '0') + ' / ' + total;
  $('progress-fill').style.width = ((state.current + 1) / total * 100) + '%';
  $('q-title').textContent = q.text;
  $('q-sub').textContent = q.sub || '';
  const box = $('q-options');
  const letters = ['A', 'B', 'C', 'D'];
  box.innerHTML = q.options.map((opt, i) => `
    <button class="option ${state.answers[state.current] === i ? 'selected' : ''}" data-index="${i}">
      <span class="badge">${letters[i]}</span>
      <span class="opt-text">${opt.text}</span>
    </button>
  `).join('');
  box.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', () => {
      state.answers[state.current] = parseInt(btn.dataset.index, 10);
      box.querySelectorAll('.option').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      updateNav();
      if (state.current < total - 1) { setTimeout(() => { state.current++; renderQuestion(); }, 280); }
    });
  });
  updateNav();
}

function updateNav() {
  const hasAnswer = state.answers[state.current] !== null;
  const isFirst = state.current === 0;
  const isLast = state.current === QUESTIONS.length - 1;
  $('btn-prev').style.visibility = isFirst ? 'hidden' : 'visible';
  if (isLast) {
    $('btn-next').style.visibility = 'visible';
    $('btn-next').textContent = '查看结果';
    $('btn-next').disabled = !hasAnswer;
    $('btn-next').style.opacity = hasAnswer ? '1' : '.4';
  } else {
    $('btn-next').style.visibility = 'hidden';
  }
}

  state.answers.forEach((optIndex, qIndex) => {
    const opt = QUESTIONS[qIndex].options[optIndex];
    if (opt && opt.styles) {
      opt.styles.forEach(sid => { if (styleScores[sid] !== undefined) styleScores[sid] += 1; });
    }
  });

  const rankedStyles = Object.entries(styleScores).sort((a, b) => b[1] - a[1]);
  const topStyleId = rankedStyles[0][0];
  const secondStyleId = rankedStyles[1][0];

  const archScores = { A:0, B:0, C:0, D:0, E:0, F:0 };
  Object.keys(styleScores).forEach(sid => {
    const arch = STYLES[sid].archetype;
    archScores[arch] += styleScores[sid];
  });
  const archTotal = Object.values(archScores).reduce((a, b) => a + b, 0);
  const archPercents = {};
  Object.keys(archScores).forEach(k => {
    archPercents[k] = archTotal > 0 ? Math.round(archScores[k] / archTotal * 100) : 0;
  });
  const sumPct = Object.values(archPercents).reduce((a, b) => a + b, 0);
  if (sumPct !== 100 && archTotal > 0) {
    const maxKey = Object.keys(archPercents).sort((a,b) => archPercents[b] - archPercents[a])[0];
    archPercents[maxKey] += (100 - sumPct);
  }

  return { rankedStyles, topStyleId, secondStyleId, archPercents };
}

/* ============================================================
   结果渲染
   ============================================================ */
function renderResult() {
  const { rankedStyles, topStyleId, secondStyleId, archPercents } = computeResult();
  const topStyle = STYLES[topStyleId];
  const secondStyle = STYLES[secondStyleId];
  const topScore = rankedStyles[0][1];
  const secondScore = rankedStyles[1][1];
  const gap = topScore - secondScore;

  const isMix = gap <= 2 && topStyle.archetype !== secondStyle.archetype;
  let mixName = '';
  if (isMix) {
    mixName = `${topStyle.name} × ${secondStyle.name}`;
  }

  const topArch = topStyle.archetype;

  /* ---------- 头部 ---------- */
  $('r-eyebrow').textContent = isMix ? '混搭风格' : '主导风格';
  $('r-name').textContent = isMix ? mixName : topStyle.name;
  $('r-en').textContent = isMix ? `${topStyle.archetype} 系 × ${secondStyle.archetype} 系` : (topStyle.archetype + ' 系');
  $('r-slogan').textContent = isMix ? `“${topStyle.slogan}” × “${secondStyle.slogan}”` : topStyle.slogan;

  /* ---------- 视觉封面 ---------- */
  const visual = $('r-visual');
  if (visual) {
    if (isMix) {
      const g1 = topStyle.gradient || 'linear-gradient(135deg, #2a2830, #17161a)';
      const g2 = secondStyle.gradient || 'linear-gradient(135deg, #2a2830, #17161a)';
      visual.style.background = `${g1}, ${g2}`;
      visual.style.backgroundBlendMode = 'overlay';
      visual.innerHTML = `
        <span>${topStyle.emoji || '◆'}${secondStyle.emoji || '◇'}</span>
        <span class="visual-label">${topStyle.name} × ${secondStyle.name}</span>
      `;
    } else {
      visual.style.background = topStyle.gradient || 'linear-gradient(135deg, #2a2830, #17161a)';
      visual.innerHTML = `
        <span>${topStyle.emoji || '◆'}</span>
        <span class="visual-label">${topStyle.name}</span>
      `;
    }
  }

  /* ---------- 原型分布（无百分比数字） ---------- */
  const archNames = { A:'秩序理性', B:'反叛边缘', C:'怀旧浪漫', D:'享乐消费', E:'未来数字', F:'自然共生' };
  const archColors = { A:'var(--c-A)', B:'var(--c-B)', C:'var(--c-C)', D:'var(--c-D)', E:'var(--c-E)', F:'var(--c-F)' };
  $('r-chart').innerHTML = Object.entries(archPercents).sort((a,b) => b[1]-a[1]).map(([k, pct]) => `
    <div class="chart-row ${k === topArch ? 'dominant' : ''}">
      <span class="chart-label">${archNames[k]}</span>
      <span class="chart-bar-bg"><i class="chart-bar-fill" data-width="${pct}" style="background:${archColors[k]};"></i></span>
    </div>
  `).join('');
  requestAnimationFrame(() => { setTimeout(() => { document.querySelectorAll('.chart-bar-fill').forEach(el => { el.style.width = el.dataset.width + '%'; }); }, 100); });

  /* ---------- 思想解读 ---------- */
  if (isMix) {
    $('r-thought').innerHTML = `你的风格在 <b>${topStyle.name}</b> 与 <b>${secondStyle.name}</b> 之间摇摆。这两种思想相互补充，形成了你独特的混搭气质。<br><br><b>${topStyle.name}：</b>${topStyle.desc}<br><br><b>${secondStyle.name}：</b>${secondStyle.desc}`;
  } else {
    $('r-thought').innerHTML = `<b>${topStyle.name}</b><br>${topStyle.desc}<br><br><b>思想内核：</b>${topStyle.slogan}`;
  }

  /* ---------- 风格配比（无百分比） ---------- */
  if (isMix) {
    $('r-ratio').innerHTML = `
      <div class="ratio-item"><div class="r-name">${topStyle.name}</div><div class="r-sub">主 风 格</div></div>
      <div class="ratio-item"><div class="r-name">${secondStyle.name}</div><div class="r-sub">副 风 格</div></div>`;
  } else {
    $('r-ratio').innerHTML = `<div class="ratio-item"><div class="r-name">${topStyle.name}</div><div class="r-sub">纯 粹 风 格</div></div>`;
  }

  /* ---------- 穿搭系统 ---------- */
  const main = topStyle;
  const extra = isMix ? secondStyle : null;
  let gridHtml = `
    <div class="cell"><div class="k">色彩</div><div class="v">${main.colors}${extra ? ' / ' + extra.colors : ''}</div></div>
    <div class="cell"><div class="k">材质</div><div class="v">${main.materials}${extra ? ' / ' + extra.materials : ''}</div></div>
    <div class="cell wide"><div class="k">核心单品</div><div class="v"><ul>${main.items.map(i => `<li>${i}</li>`).join('')}${extra ? extra.items.slice(0,2).map(i => `<li>${i}（融入）</li>`).join('') : ''}</ul></div></div>
    <div class="cell"><div class="k">配饰</div><div class="v">${main.accessories}${extra ? ' / ' + extra.accessories : ''}</div></div>
    <div class="cell wide"><div class="k">避　免</div><div class="v">${main.avoid}${extra ? '；同时避免与' + extra.avoid + '冲突' : ''}</div></div>`;
  $('r-grid').innerHTML = gridHtml;

  /* ---------- 标签 ---------- */
  $('r-tags').innerHTML = `<span>#${main.name}</span>${isMix ? `<span>#${secondStyle.name}</span>` : ''}<span>#${archNames[topArch]}</span>`;

  /* ---------- 建议 ---------- */
  let adviceHtml = `<p class="a-title">给你的建议</p>`;
  if (isMix) {
    adviceHtml += `<p>你的风格在 <b>${topStyle.name}</b> 和 <b>${secondStyle.name}</b> 之间游走，这让你既有主风格的骨架，又有副风格的点缀。</p>
      <p>建议以 <b>${topStyle.name}</b> 为主（约70%），用 <b>${secondStyle.name}</b> 的元素做点缀（约30%）。例如：穿好主风格的核心单品（${main.items[0]}），再加入副风格的一件配饰或一件单品（${secondStyle.items[0]}）。</p>
      <p>不要五五开，否则会失去焦点。如果某天想切换状态，可以把比例倒过来。</p>`;
  } else {
    adviceHtml += `<p>你的风格非常集中，<b>${topStyle.name}</b> 是你最自然的表达。你不需要混搭来证明什么，纯粹就是你的力量。</p>
      <p>建议从核心单品开始建立衣橱：<b>${main.items[0]}</b>。围绕它扩展，保持色彩与材质的一致性。</p>
      <p>如果哪天觉得单调，可以在配饰上做文章——${main.accessories}——但不要改变整体结构。</p>`;
  }
  $('r-advice').innerHTML = adviceHtml;

  /* ---------- 同原型其他风格 ---------- */
  const siblings = Object.values(STYLES).filter(s => s.archetype === topArch && s.name !== main.name).slice(0, 4);
  $('r-alt-list').innerHTML = siblings.map(s => `<div class="alt-item">${s.emoji || ''} ${s.name}</div>`).join('');
}

/* ============================================================
   事件绑定
   ============================================================ */
$('btn-start').addEventListener('click', () => {
  state.current = 0;
  state.answers = new Array(QUESTIONS.length).fill(null);
  renderQuestion();
  showScreen('screen-quiz');
});
$('btn-prev').addEventListener('click', () => { if (state.current > 0) { state.current--; renderQuestion(); } });
$('btn-next').addEventListener('click', () => {
  if (state.answers[state.current] === null) return;
  if (state.current < QUESTIONS.length - 1) { state.current++; renderQuestion(); }
  else {
    const unanswered = state.answers.findIndex(a => a === null);
    if (unanswered !== -1) { state.current = unanswered; renderQuestion(); return; }
    renderResult();
    showScreen('screen-result');
  }
});
$('btn-restart').addEventListener('click', () => {
  state.current = 0;
  state.answers = new Array(QUESTIONS.length).fill(null);
  showScreen('screen-start');
});
</script>
</body>
</html>
